<label class="field__label" [class.visually-hidden]="hiddenLabel()" [attr.for]="controlId">
  {{ label() }}
  @if (required()) {
    <span class="field__required">({{ 'common.required' | transloco }})</span>
  }
</label>
<div class="field__control">
  @if (markdownEditor(); as editor) {
    <!-- Barre Markdown : masquée, elle flotte au-dessus du champ tant qu'il a le focus. -->
    <app-markdown-toolbar class="field__toolbar" [editor]="editor" [controlId]="controlId" />
  }
  <ng-content />
  @if (markdownEditor(); as editor) {
    @if (focused() || !editor.text()) {
      <!-- Texte source coloré, aligné caractère par caractère sur le champ (curseur compris). -->
      <div
        class="field__overlay field__source app-markdown-source"
        aria-hidden="true"
        [innerHTML]="sourceHtml()"
        [scrollTop]="editor.scrollTop()"
      ></div>
    } @else {
      <!-- Texte mis en page, hors focus. -->
      <div
        class="field__overlay field__preview app-markdown app-markdown-preview"
        aria-hidden="true"
        [innerHTML]="editor.text() | markdown"
        (mousedown)="editMarkdown($event, editor)"
      ></div>
    }
  }
</div>
@if (error()) {
  <p class="field__error" role="alert" [id]="messageId">{{ error() }}</p>
} @else if (hint()) {
  <p class="field__hint" [id]="messageId">{{ hint() }}</p>
}
