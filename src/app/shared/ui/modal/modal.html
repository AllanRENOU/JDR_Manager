<header class="modal__header">
  <div class="modal__heading">
    <ng-content select="[modalIcon]" />
    <div>
      <h2 class="modal__title" [id]="titleId">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="modal__subtitle">{{ subtitle() }}</p>
      }
    </div>
  </div>
  @if (!hideClose()) {
    <button
      appButton="icon"
      type="button"
      [attr.aria-label]="'common.actions.close' | transloco"
      (click)="close()"
    >
      <svg lucideX aria-hidden="true"></svg>
    </button>
  }
</header>
<div class="modal__content">
  <ng-content />
</div>
<footer class="modal__footer">
  <div class="modal__footer-start"><ng-content select="[modalFooterStart]" /></div>
  <div class="modal__footer-end"><ng-content select="[modalFooterEnd]" /></div>
</footer>
