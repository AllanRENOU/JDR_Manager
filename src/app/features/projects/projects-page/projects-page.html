<app-header>
  <span headerStart class="logo">JDR Manager</span>
  <a
    headerEnd
    appButton="icon"
    size="header"
    routerLink="/settings"
    [attr.aria-label]="'settings.open' | transloco"
  >
    <svg lucideSettings aria-hidden="true"></svg>
  </a>
</app-header>

<main class="page">
  <h1 class="page__title">{{ 'project.title' | transloco }}</h1>

  @if (projects.error()) {
    <app-alert>{{ 'project.loadError' | transloco }}</app-alert>
  } @else if (projects.hasValue()) {
    @if (projects.value().length === 0) {
      <p class="page__empty">{{ 'project.empty' | transloco }}</p>
    }
    <ul class="grid">
      @for (summary of projects.value(); track summary.project.id) {
        <li>
          <app-project-card
            [summary]="summary"
            [alt]="$index % 2 === 1"
            (rename)="renameProject(summary.project)"
            (remove)="deleteProject(summary.project)"
          />
        </li>
      }
      <li class="card card--create">
        <button class="card__create" type="button" (click)="createProject()">
          <svg lucidePlus [size]="28" aria-hidden="true"></svg>
          {{ 'project.create.card' | transloco }}
        </button>
      </li>
    </ul>
  }
</main>
