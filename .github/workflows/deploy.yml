name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permet aussi de lancer le déploiement à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /JDR_Manager/
      # Pour qu'un rechargement sur une route Angular (ex. /JDR_Manager/projets/12) ne donne pas une 404
      - run: cp dist/jdr-manager/browser/index.html dist/jdr-manager/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/jdr-manager/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
